services:
  gmatchat:
    build:
      context: .
      secrets:
        - gmatbard_github_token
    container_name: gmatchat
    ports:
      - "8080:8080"
      - "7681-7690:7681-7690"
    volumes:
      - ./:/workspace
      - /home/joeyoberholtzer/installs/gmat-ubuntu-x64-R2025a/GMAT/R2025a:/gmat:ro
      - claude_config:/home/claude/.claude
    # Do NOT use `env_file` here. It would dump EVERY key in .env into the
    # container environment (ANTHROPIC_API_KEY and the build-only
    # GMATBARD_GITHUB_TOKEN included), where the sandboxed claude session can
    # read them with `env`. Pass ONLY what the runtime actually needs.
    # Compose still auto-reads .env for the ${...} interpolation below and for
    # the build secret, so nothing else breaks.
    #   - GITHUB_TOKEN: needed by entrypoint.sh to seed git's credential store.
    #   - ANTHROPIC_API_KEY: intentionally omitted — claude-code authenticates
    #     via interactive OAuth persisted in the claude_config volume, not a key.
    #   - GMATBARD_GITHUB_TOKEN: build-only secret; must never reach runtime.
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    restart: unless-stopped

secrets:
  gmatbard_github_token:
    environment: GMATBARD_GITHUB_TOKEN

volumes:
  claude_config:
