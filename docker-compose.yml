services:
  gmatchat:
    build:
      context: .
      secrets:
        - gmatbard_github_token
    container_name: gmatchat
    ports:
      - "8080:8080"
      - "7681-7690:7681-7690"
    volumes:
      - ./:/workspace
      - /home/joeyoberholtzer/installs/gmat-ubuntu-x64-R2025a/GMAT/R2025a:/gmat:ro
      - claude_config:/home/claude/.claude
    env_file:
      - path: .env
        required: false
    environment:
      - GITHUB_TOKEN
    restart: unless-stopped

secrets:
  gmatbard_github_token:
    environment: GMATBARD_GITHUB_TOKEN

volumes:
  claude_config:
